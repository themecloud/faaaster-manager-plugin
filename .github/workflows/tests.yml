name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CSS LCP collector syntax and tests
        run: |
          node --input-type=module --check < assets/image-css-lcp.js
          node test/image-optimization/css-lcp.mjs
      - name: Auth cookie tests
        run: php test/auth-cookie.php
      - name: Cache module tests
        run: php test/cache/run.php
      - name: Image optimization tests (real WordPress HTML API)
        run: |
          curl --fail --location --silent --show-error https://wordpress.org/wordpress-6.9.zip -o "$RUNNER_TEMP/wordpress-image-test.zip"
          echo "3e95777a3acb3b05d5cdbd31b16fc1e9b71122ebe3c1f18c6f53dee3eab0d111  $RUNNER_TEMP/wordpress-image-test.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/wordpress-image-test.zip" -d "$RUNNER_TEMP/image-optimization"
          WP_TEST_CORE_DIR="$RUNNER_TEMP/image-optimization/wordpress" php test/image-optimization/run.php
      - name: Loopback TLS tests
        run: php test/loopback-tls.php
      - name: Theme upgrade skin prints nothing
        run: php test/theme-quiet-skin.php
      - name: Translations compiled from .po
        run: php scripts/build-i18n.php && git diff --exit-code -- languages/
